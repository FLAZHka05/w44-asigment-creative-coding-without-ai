<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/stylesheet.css">
    <title>Rave poster </title>
</head>
<body>
    <div class="container">
        <!-- Poster content that keeps everything inside -->
        <div class="poster" id="poster">
            <!-- Poster content that is displayed on top of the canvas -->
            <div class="poster-content">
                <h1 class="poster-title">Rave Night IN SÖDERTÖRNS UNIVERSITY</h1>
                <img src="./img/symbol_rgb.png" alt="Södertörn University logo" class="poster-image">
                <p class="poster-description">Join us for an unforgettable night of music and dance!</p>
                <p class="poster-details">Date: June 30, 2027</p>
                <p class="poster-details">Location: Södertörn University pub</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="./js/JS.js"></script>
</body>
</html>
